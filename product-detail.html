<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="nav-logo border" id="logoBtn"><div class="logo"></div></div>
            <div class="nav-address border" id="locationBtn">
                <p class="add-first">Deliver to</p>
                <div class="add-icon"><i class="fa-solid fa-location-dot"></i><p class="add-sec">India</p></div>
            </div>
            <div class="nav-search" id="searchBar">
                <select class="search-select" id="searchCategory"></select>
                <input type="text" placeholder="Search Amazon" class="search-input" id="searchInput">
                <button type="button" class="search-icon" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="nav-signin border" id="signinBtn">
                <p><span>Hello, sign in</span></p>
                <p class="nav-second">Account &amp; Lists</p>
            </div>
            <div class="nav-return border" id="ordersBtn">
                <p><span>Returns</span></p>
                <p class="nav-second">&amp; Orders</p>
            </div>
            <div class="nav-cart border" id="cartBtn">
                <div class="cart-icon-wrap">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <span class="cart-label">Cart</span>
            </div>
        </div>
    </header>

    <main class="page-main">
        <div class="breadcrumb">
            <a href="index.html">Home</a> &rsaquo; <span id="breadcrumbCategory">Product</span>
        </div>

        <section class="product-detail" id="productDetail">
            <!-- Filled by JS -->
        </section>

        <section class="related-section">
            <h2>Related Products</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </section>
    </main>

    <footer>
        <div class="foot-panel1" id="backToTop">Back to Top</div>
        <div class="foot-panel4">
            <div class="copyright">&copy; 1996-2023, Amazon.com, Inc. or its affiliates</div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/products.js"></script>
    <script src="js/common.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
